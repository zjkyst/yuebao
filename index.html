<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>高技能人才月报填报系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{padding:20px;background:#f4f7fa}
.container{max-width:1400px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px #00000010}
.login-wrap{max-width:420px;margin:80px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 2px 14px #0002}
.login-wrap h2{text-align:center;margin-bottom:24px;color:#222}
.form-item{margin-bottom:16px}
.form-item label{display:block;margin-bottom:6px;color:#444}
.form-item input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:16px}
button{padding:10px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{border:1px solid #ddd;padding:10px;text-align:center}
th{background:#f1f5f9}
input.table-input{width:100%;border:0;padding:4px 6px}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ========= 模拟数据版本，不访问数据库，前端页面调试 =========
const userList = [
  {user:"admin",pwd:"yb2026",role:"admin",name:"管理员"},
  {user:"市本级",pwd:"yb2026",role:"city",name:"市本级管理员"},
  {user:"小店区",pwd:"yb2026",role:"county",name:"小店区填报员"},
];

// 模拟测试数据
const mockData = [
  {id:1, area:"太原市", b:"100", c:"20", d:"30", e:"40", f:"50", g:"60", m:"88"},
  {id:2, area:"吕梁市", b:"75", c:"12", d:"22", e:"33", f:"44", g:"55", m:"66"},
];

function renderLogin(){
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <h2>月报填报系统登录</h2>
    <div class="form-item">
      <label>用户名</label>
      <input id="username" placeholder="输入用户名">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input id="password" type="password" placeholder="输入密码">
    </div>
    <button onclick="login()">登录</button>
  </div>
  `;
}
window.login = async function(){
  const uName = document.getElementById("username").value.trim();
  const pwd = document.getElementById("password").value.trim();
  const user = userList.find(x=>x.user===uName && x.pwd===pwd);
  if(!user){
    alert("用户名或密码错误");
    return;
  }
  await renderTable(user);
}

async function renderTable(userInfo){
  document.getElementById('app').innerHTML = `
  <div class="container">
    <h2>月报填报 - 当前登录：${userInfo.name}</h2>
    <table>
      <thead>
        <tr>
          <th>地区</th>
          <th>B目标任务</th>
          <th>C</th><th>D</th><th>E</th><th>F</th><th>G</th>
          <th>M百行百业</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>
  </div>
  `
  const tbody = document.getElementById("table-body");
  mockData.forEach(item=>{
    const isReadOnlyB = userInfo.role === "county";
    const isReadOnlyM = userInfo.role === "county";
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.area||''}</td>
      <td><input class="table-input" value="${item.b||''}" ${isReadOnlyB ? 'readonly':''}></td>
      <td><input class="table-input" value="${item.c||''}"></td>
      <td><input class="table-input" value="${item.d||''}"></td>
      <td><input class="table-input" value="${item.e||''}"></td>
      <td><input class="table-input" value="${item.f||''}"></td>
      <td><input class="table-input" value="${item.g||''}"></td>
      <td><input class="table-input" value="${item.m||''}" ${isReadOnlyM ? 'readonly':''}></td>
    `;
    tbody.appendChild(tr);
  })
}
renderLogin();
</script>
</body>
</html>
