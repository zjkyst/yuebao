<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>高技能人才月报填报系统</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
    body{padding:20px;background:#f4f7fa}
    .container{max-width:1400px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px #00000010}
    .login-wrap{max-width:420px;margin:80px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 2px 14px #0002}
    .login-wrap h2{text-align:center;margin-bottom:24px;color:#222}
    .form-item{margin-bottom:16px}
    .form-item label{display:block;margin-bottom:6px;color:#444}
    .form-item input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:16px}
    button{padding:10px 18px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;font-size:16px}
    .login-btn{width:100%}
    .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{border:1px solid #ddd;padding:8px 6px;text-align:center}
    th{background:#f1f5f9}
    input.table-input{width:100%;border:0;background:transparent;padding:4px;text-align:center}
    input.table-input:disabled{background:#eee;color:#888}
    .tip{color:#666;margin:8px 0;font-size:14px}
    .err{color:#dc2626;margin-top:12px}
    .success-msg{color:#16a34a;margin-top:12px}
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ========= 在这里替换你的 Supabase 项目地址和 anon key =========
const SUPABASE_URL = "https://nfdywdhegjghwimuedkr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZHl3ZGhlZ2pnaHdpbXVlZGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNjc5NzYsImV4cCI6MjEwNzg0Mzk3Nn0.yRyypCTlxvLHo3VZ0sJYwe-KFzC6HrAkBRTiJmLTO98";
// ============================================================
const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let userInfo = null;
let reportData = [];

async function render(){
  const app = document.getElementById("app");
  const {data:{session}} = await supabase.auth.getSession();
  if(!session || !session.user){
    app.innerHTML = `
    <div class="login-wrap">
      <h2>月报填报系统登录</h2>
      <div class="form-item">
        <label>用户名</label>
        <input id="username" placeholder="输入用户名" />
      </div>
      <div class="form-item">
        <label>密码</label>
        <input id="pwd" type="password" placeholder="输入密码"/>
      </div>
      <button class="login-btn" onclick="doLogin()">登录</button>
      <div id="loginMsg" class="err"></div>
    </div>`;
    return;
  }
  // 查询用户信息
  const {data:uData,error:uErr}=await supabase.from("yb_users").select("*").eq("id",session.user.id).single();
  if(uErr || !uData){
    app.innerHTML = `<div class="container"><h3>用户信息读取失败，请刷新页面</h3></div>`;
    return;
  }
  userInfo = uData;
  const roleName = userInfo.role==="admin"?"管理员":(userInfo.role==="shi"?"市本级":"县区填报员");
  await loadReports();
  app.innerHTML = `
  <div class="container">
    <div class="top-bar">
      <div>
        <h2>高技能人才月报填报表</h2>
        <div class="tip">当前登录：${userInfo.username}（${roleName}）</div>
      </div>
      <div>
        <button onclick="saveAll()">保存全部</button>
        <button style="background:#666;margin-left:8px" onclick="logout()">退出登录</button>
      </div>
    </div>
    <div class="tip">说明：C-I为填报项；J=SUM(C~I)；K=J/B（百分比）；N=J+L+M；<br>【目标任务B、M百行百业】仅市本级账号可编辑，县区账号锁定</div>
    <table>
      <thead>
        <tr>
          <th>县区</th>
          <th>B<br/>目标任务</th>
          <th>C</th>
          <th>D</th>
          <th>E</th>
          <th>F</th>
          <th>G</th>
          <th>H</th>
          <th>I</th>
          <th>J合计<br/>C-I</th>
          <th>K完成率<br/>J/B</th>
          <th>L</th>
          <th>M<br/>百行百业</th>
          <th>N合计<br/>J+L+M</th>
        </tr>
      </thead>
      <tbody>
        ${reportData.map(row=>{
          const isShi = userInfo.role === "shi" || userInfo.role === "admin";
          const isMyRow = userInfo.district === row.district || userInfo.role === "admin" || userInfo.role === "shi";
          const lockB = !isShi;
          const lockM = !isShi;
          const j = Number(row.c||0)+Number(row.d||0)+Number(row.e||0)+Number(row.f||0)+Number(row.g||0)+Number(row.h||0)+Number(row.i||0);
          const b = Number(row.b||0);
          const kVal = b===0 ? 0 : (j / b *100).toFixed(2);
          const n = j + Number(row.l||0) + Number(row.m||0);
          return `<tr data-id="${row.id}">
            <td>${row.district}</td>
            <td><input class="table-input" data-key="b" value="${row.b??''}" ${lockB?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" data-key="c" value="${row.c??''}" ${!isMyRow?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" data-key="d" value="${row.d??''}" ${!isMyRow?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" data-key="e" value="${row.e??''}" ${!isMyRow?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" data-key="f" value="${row.f??''}" ${!isMyRow?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" data-key="g" value="${row.g??''}" ${!isMyRow?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" data-key="h" value="${row.h??''}" ${!isMyRow?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" data-key="i" value="${row.i??''}" ${!isMyRow?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" value="${j}" disabled/></td>
            <td><input class="table-input" value="${kVal}%" disabled/></td>
            <td><input class="table-input" data-key="l" value="${row.l??''}" ${!isMyRow?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" data-key="m" value="${row.m??''}" ${lockM?"disabled":""} onchange="cellChange(this,'${row.id}')"/></td>
            <td><input class="table-input" value="${n}" disabled/></td>
          </tr>`
        }).join("")}
      </tbody>
    </table>
    <div id="msgBox"></div>
  </div>`;
}

window.cellChange = function(input,rowId){
  const row = reportData.find(r=>r.id===rowId);
  const key = input.dataset.key;
  row[key] = input.value;
}

window.saveAll = async function(){
  const {error} = await supabase.from("yb_reports").upsert(reportData);
  const msgBox = document.getElementById("msgBox");
  if(error){
    msgBox.innerHTML = `<div class="err">保存失败：${error.message}</div>`
  }else{
    msgBox.innerHTML = `<div class="success-msg">✅ 保存成功！</div>`
  }
}

window.doLogin = async function(){
  const username = document.getElementById("username").value.trim();
  const pwd = document.getElementById("pwd").value.trim();
  const msgDom = document.getElementById("loginMsg");
  const {data:userRow,error:findErr}=await supabase.from("yb_users").select("id,password_hash").eq("username",username).single();
  if(findErr || !userRow){
    msgDom.textContent="用户名不存在";return;
  }
  if(userRow.password_hash !== pwd){
    msgDom.textContent="密码错误";return;
  }
  await supabase.auth.signInWithIdToken({provider:"email",token:userRow.id});
  await render();
}

window.logout = async function(){
  await supabase.auth.signOut();
  await render();
}

async function loadReports(){
  const {data,error}=await supabase.from("yb_reports").select("*").order("district");
  if(!error) reportData=data||[];
}
render();
</script>
</body>
</html>
