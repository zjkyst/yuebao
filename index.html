<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>高技能人才月报填报系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{padding:20px;background:#f4f7fa}
.container{max-width:1400px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px #00000010}
.login-wrap{max-width:420px;margin:80px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 2px 14px #0002}
.login-wrap h2{text-align:center;margin-bottom:24px;color:#222}
.form-item{margin-bottom:16px}
.form-item label{display:block;margin-bottom:6px;color:#444}
.form-item input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:16px}
button{padding:10px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{border:1px solid #ddd;padding:10px;text-align:center}
th{background:#f1f5f9}
input.table-input{width:100%;border:0;padding:4px 6px}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ========= 在这里填入你的Supabase信息 =========
const SUPABASE_URL = "https://nfdywdhegjghwimuedkr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZHl3ZGhlZ2pnaHdpbXVlZGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNjc5NzYsImV4cCI6MjEwNzg0Mzk3Nn0.yRyypCTlxvLHo3VZ0sJYwe-KFzC6HrAkBRTiJmLTO98";
// =============================================

// 内嵌简易supabase客户端，不再依赖CDN
const supabase = {
  url: SUPABASE_URL,
  key: SUPABASE_ANON_KEY,
  from(tableName){
    return {
      async select(){
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${tableName}?order=id`,{
          headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"}
        })
        const data = await res.json();
        return {data, error:null};
      },
      async update(obj){
        return {data:obj,error:null};
      }
    }
  }
}

const userList = [
  {user:"admin",pwd:"yb2026",role:"admin",name:"管理员"},
  {user:"市本级",pwd:"yb2026",role:"city",name:"市本级管理员"},
  {user:"小店区",pwd:"yb2026",role:"county",name:"小店区填报员"},
];

function renderLogin(){
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <h2>月报填报系统登录</h2>
    <div class="form-item">
      <label>用户名</label>
      <input id="username" placeholder="输入用户名">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input id="password" type="password" placeholder="输入密码">
    </div>
    <button onclick="login()">登录</button>
  </div>
  `;
}
window.login = async function(){
  const uName = document.getElementById("username").value.trim();
  const pwd = document.getElementById("password").value.trim();
  const user = userList.find(x=>x.user===uName && x.pwd===pwd);
  if(!user){
    alert("用户名或密码错误");
    return;
  }
  await renderTable(user);
}

async function renderTable(userInfo){
  let {data,error} = await supabase.from("yuebao").select();
  if(error) console.log(error);
  let rows = data || [];
  document.getElementById('app').innerHTML = `
  <div class="container">
    <h2>月报填报 - 当前登录：${userInfo.name}</h2>
    <table>
      <thead>
        <tr>
          <th>地区</th>
          <th>B目标任务</th>
          <th>C</th><th>D</th><th>E</th><th>F</th><th>G</th>
          <th>M百行百业</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>
  </div>
  `
  const tbody = document.getElementById("table-body");
  rows.forEach(item=>{
    const isReadOnlyB = userInfo.role === "county";
    const isReadOnlyM = userInfo.role === "county";
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.area}</td>
      <td><input class="table-input" value="${item.b||''}" ${isReadOnlyB ? 'readonly':''} onchange="saveRow(${item.id},'b',this.value)"></td>
      <td><input class="table-input" value="${item.c||''}" onchange="saveRow(${item.id},'c',this.value)"></td>
      <td><input class="table-input" value="${item.d||''}" onchange="saveRow(${item.id},'d',this.value)"></td>
      <td><input class="table-input" value="${item.e||''}" onchange="saveRow(${item.id},'e',this.value)"></td>
      <td><input class="table-input" value="${item.f||''}" onchange="saveRow(${item.id},'f',this.value)"></td>
      <td><input class="table-input" value="${item.g||''}" onchange="saveRow(${item.id},'g',this.value)"></td>
      <td><input class="table-input" value="${item.m||''}" ${isReadOnlyM ? 'readonly':''} onchange="saveRow(${item.id},'m',this.value)"></td>
    `;
    tbody.appendChild(tr);
  })
}
window.saveRow = async function(id,col,val){
  await fetch(`${SUPABASE_URL}/rest/v1/yuebao?id=eq.${id}`,{
    method:"PATCH",
    headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({[col]:val})
  })
}
renderLogin();
</script>
</body>
</html>
